generation:
  num_subsamples: 1
  num_demos: 10
  num_prompts_per_subsample: 25
  model:
    name: GPT_forward
    batch_size: 1
    gpt_config:
      model: meta-llama/Llama-3.1-8B-Instruct
      temperature: 0.9
      max_tokens: 15
      top_p: 0.9
      frequency_penalty: 0.0
      presence_penalty: 0.0
evaluation:
  method: likelihood
  num_samples: 1000
  num_few_shot: 8
  model:
    name: GPT_forward
    batch_size: 1
    gpt_config:
      model: meta-llama/Llama-3.1-8B-Instruct
      temperature: 0.7
      max_tokens: 200
      top_p: 1.0
      frequency_penalty: 0.0
      presence_penalty: 0.0
demo:
  model:
    name: GPT_forward
    batch_size: 8
    gpt_config:
      model: meta-llama/Llama-3.1-8B-Instruct
      temperature: 0.7
      max_tokens: 200
      top_p: 1.0
      frequency_penalty: 0.0
      presence_penalty: 0.0
